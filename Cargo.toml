[package]
name = "image-conv"
version = "1.0.0"
authors = ["Gaurav Patel <GauravPatel97@outlook.com>"]
edition = "2021"
license = "Apache-2.0"
description = "High performance image convolution library."
categories = ["multimedia", "multimedia::images"]
readme = "./README.md"
repository = "https://github.com/gp-97/image-conv"
exclude = [
    "assets/*",
    "tests/test_assets/*"
]

[dependencies]
photon-rs = "0.3.3"
image = "0.24"
prettytable-rs = "0.10"
rayon = "1.12.0"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "conv_bench"
harness = false
